{% extends "base.html" %}

{% block content %}



<!-- Static demo version (NO Jinja) -->
<section class="card">
   <form action="{{ url_for('add') }}" method="POST" class="add-form">
    <input
        type="text"
        name="title"
        placeholder="What do you need to do?"
        autocomplete="off"
        autofocus>
    <button type="submit">Add</button>
</form>
</section>

<section class="card">
    {% if tasks %}
    <ul class="tasks">
        {% for task in tasks %}
        <li class="task{{ ' done' if task.done else '' }}">

    <form action="{{ url_for('toggle', task_id=task.id) }}" method="POST">
        <button type="submit" class="toggle" title="Mark complete/undo">✓</button>
    </form>

    <span class="title">{{ task.title }}</span>

    <form action="{{ url_for('delete', task_id=task.id) }}" method="POST">
        <button type="submit" class="delete" title="Delete">×</button>
    </form>

</li>
        {% endfor %}
    </ul>
    {% else %}
    <p class="empty">No Tasks yet</p>
    {% endif %}
</section>

{% endblock %}
